# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings below override Omarchy's defaults in /etc/xdg/kitty/kitty.conf.
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Xanh Mono — Redistributable mono. Not a Nerd Font.
# Icons are mapped; everything else missing falls through fontconfig.
font_family Xanh Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B5,U+E700-U+E7C5,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2E0,U+F300-U+F381,U+F400-U+F533,U+F0000-U+F1AF0 Symbols Nerd Font Mono

# Window padding
# window_padding_width 14

# Unmap a shortcut, passing it through to the terminal application
# map ctrl+insert

# Set or replace a shortcut
# map ctrl+shift+c copy_to_clipboard

# Remove all inherited shortcuts, including Kitty's built-in shortcuts
# clear_all_shortcuts yes
