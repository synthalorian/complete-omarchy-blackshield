<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Blackshield type for this install.

  Monospace is Xanh Mono. Kelmscott Mono is the face on the author's desk
  and has no redistribution license, so it is not in this repo.
  Symbols Nerd Font Mono is icons only. Noto Sans Mono covers the rest.
  Pirata One answers serif and is named from the crest.

  Do not run `omarchy font set`. It rewrites this file and drops the
  symbol fallback. The bar then goes blank.
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Xanh Mono</string>
      <string>Symbols Nerd Font Mono</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>

  <alias>
    <family>Xanh Mono</family>
    <accept>
      <family>Symbols Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
    </accept>
  </alias>

  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Pirata One</string>
    </edit>
  </match>
</fontconfig>
